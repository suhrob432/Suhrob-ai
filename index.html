<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090914">
<title>SUHROB AI</title>
<style>
:root{--bg:#080811;--panel:#111120;--panel2:#17172a;--line:#292944;--text:#f6f5ff;--muted:#a6a5c5;--purple:#9b5cff;--pink:#e35cff;--blue:#5e8bff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#251344 0,transparent 36%),radial-gradient(ellipse at 0% 100%,#111e49 0,transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.app{max-width:1000px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;border:1px solid #ffffff16;background:#11111dbb;backdrop-filter:blur(18px);padding:14px 17px;border-radius:20px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--pink));font-weight:900;font-size:18px;box-shadow:0 0 28px #9b5cff44}
h1{font-size:17px;letter-spacing:1.5px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:3px}.badge{font-size:11px;border:1px solid #7650a9;background:#6c3e9b25;color:#d9bcff;border-radius:999px;padding:7px 10px}
main{flex:1;display:flex;flex-direction:column;max-width:780px;width:100%;margin:0 auto;padding:28px 0 16px}.welcome{text-align:center;padding:35px 12px 22px}.orb{width:74px;height:74px;border-radius:25px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(140deg,#28204e,#15152d);border:1px solid #9b5cff77;box-shadow:0 0 45px #8a4dff30;font-size:32px}.welcome h2{font-size:clamp(26px,5vw,38px);margin:0 0 10px;letter-spacing:-1px}.gradient{background:linear-gradient(90deg,#b99aff,#f08bff,#80b5ff);-webkit-background-clip:text;background-clip:text;color:transparent}.welcome p{color:var(--muted);line-height:1.6;margin:0 auto;max-width:490px;font-size:14px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0 22px}.suggestion{border:1px solid var(--line);background:#121221cc;border-radius:15px;color:var(--text);padding:14px;text-align:left;cursor:pointer;transition:.2s}.suggestion:hover{border-color:#9b5cff;transform:translateY(-2px)}.suggestion b{display:block;font-size:13px;margin-bottom:5px}.suggestion span{font-size:12px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:14px;padding:5px 0 16px}.msg{display:flex;gap:10px;align-items:flex-start;max-width:94%}.msg.user{align-self:flex-end;flex-direction:row-reverse}.avatar{flex:0 0 31px;height:31px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;background:linear-gradient(135deg,#8e50ff,#d65aff)}.user .avatar{background:#24243a;border:1px solid #404060}.bubble{border:1px solid var(--line);background:#151523;border-radius:4px 16px 16px 16px;padding:12px 14px;line-height:1.6;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:linear-gradient(135deg,#33204f,#22223d);border-radius:16px 4px 16px 16px}
.composer-wrap{position:sticky;bottom:8px;background:#0d0d19eF;border:1px solid #34304b;padding:9px;border-radius:20px;box-shadow:0 15px 45px #0007;backdrop-filter:blur(18px)}.composer{display:flex;align-items:flex-end;gap:9px}.composer textarea{resize:none;max-height:140px;min-height:44px;flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:12px 9px}.composer textarea::placeholder{color:#8584a4}.send{border:0;border-radius:14px;width:44px;height:44px;background:linear-gradient(135deg,var(--purple),var(--pink));color:white;font-size:20px;cursor:pointer}.send:disabled{opacity:.5;cursor:wait}.foot{font-size:10px;text-align:center;color:#777691;margin:10px 0 0;line-height:1.5}.status{color:#bca5ff;font-size:12px;min-height:17px;padding:0 10px 4px}
@media(max-width:520px){.app{padding:10px}.badge{display:none}.welcome{padding:27px 8px 17px}.suggestions{grid-template-columns:1fr}.suggestion{padding:12px}.msg{max-width:100%}main{padding-top:12px}}
</style></head>
<body><div class="app">
<header><div class="brand"><div class="logo">S</div><div><h1>SUHROB AI</h1><div class="sub">Sening aqlli yordamching</div></div></div><div class="badge">✦ PREMIUM UI</div></header>
<main>
<section class="welcome" id="welcome"><div class="orb">✧</div><h2>Salom, <span class="gradient">Suhrob!</span></h2><p>Bugun nimani o‘rganamiz? Savolingni yoz — men yordam berishga tayyorman.</p></section>
<section class="suggestions" id="suggestions">
<button class="suggestion" data-prompt="Sun’iy intellekt qanday ishlashini sodda tushuntir."><b>✧ AI haqida</b><span>Sun’iy intellektni o‘rganish</span></button>
<button class="suggestion" data-prompt="Ingliz tilini o‘rganish uchun 7 kunlik reja tuz."><b>▤ O‘qish va darslar</b><span>Reja va tushuntirishlar</span></button>
<button class="suggestion" data-prompt="Steel and Flesh 2 uchun qiziqarli strategiya taklif qil."><b>♜ O‘yinlar</b><span>Strategiya va maslahatlar</span></button>
<button class="suggestion" data-prompt="O‘zbek tilida qisqa, qiziqarli hikoya yoz."><b>✎ Ijodkorlik</b><span>Hikoya va matnlar yozish</span></button>
</section>
<section class="chat" id="chat" aria-live="polite"></section>
<div class="composer-wrap"><div class="status" id="status"></div><form class="composer" id="form"><textarea id="input" rows="1" placeholder="SUHROB AI ga xabar yoz..." aria-label="Xabaringiz"></textarea><button class="send" id="send" type="submit" aria-label="Yuborish">➤</button></form></div>
<div class="foot">SUHROB AI xato qilishi mumkin. Muhim ma’lumotlarni tekshirib ko‘r.<br>AI ishlashi uchun server va API kaliti sozlanishi kerak.</div>
</main></div>
<script>
const form=document.querySelector('#form'),input=document.querySelector('#input'),chat=document.querySelector('#chat'),statusEl=document.querySelector('#status'),send=document.querySelector('#send');
function addMsg(text,who){const row=document.createElement('div');row.className='msg '+who;const av=document.createElement('div');av.className='avatar';av.textContent=who==='user'?'S':'✧';const b=document.createElement('div');b.className='bubble';b.textContent=text;row.append(av,b);chat.append(row);row.scrollIntoView({behavior:'smooth',block:'nearest'});return b}
async function sendMessage(text){text=text.trim();if(!text||send.disabled)return;document.querySelector('#welcome').style.display='none';document.querySelector('#suggestions').style.display='none';addMsg(text,'user');input.value='';input.style.height='44px';send.disabled=true;statusEl.textContent='Javob tayyorlanmoqda…';const bubble=addMsg('Biroz kut…','assistant');try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Server bilan aloqa bo‘lmadi.');bubble.textContent=data.reply||'Javob kelmadi.';statusEl.textContent='';}catch(e){bubble.textContent='Hozircha AI serveriga ulanib bo‘lmadi. Saytni haqiqiy AI bilan ishlatish uchun serverni ishga tushirish va API kalitini sozlash kerak.\n\nTexnik xabar: '+e.message;statusEl.textContent='Ulanish sozlamalarini tekshirish kerak.';}finally{send.disabled=false;input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();sendMessage(input.value)});input.addEventListener('input',()=>{input.style.height='44px';input.style.height=Math.min(input.scrollHeight,140)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>sendMessage(b.dataset.prompt)));
</script></body></html>
